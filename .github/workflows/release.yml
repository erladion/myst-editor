# Push a version tag (git tag v0.3.0 && git push origin v0.3.0) to test on Linux and
# Windows, build the AppImage, RPM, .deb and Windows installer, check the packaged app
# makes a PDF from the command line, and publish them as a GitHub release. The tag must match the version in package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            script: dist
            files: |
              release/*.AppImage
              release/*.rpm
              release/*.deb
          - os: windows-2025
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
      - run: npm ci
      - name: Build the packages
        run: npm run ${{ matrix.script }}
      # The packaged app makes a PDF from the command line, as in people's own CI: on
      # Linux without a display (and without FUSE or Chromium's sandbox).
      - name: Make a PDF from the command line (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x release/*.AppImage
          release/*.AppImage --appimage-extract-and-run --ozone-platform=headless --no-sandbox \
            --export-pdf e2e/fixture-showcase/docs --output smoke.pdf | grep -v '^/tmp/appimage_extracted_'
          test -s smoke.pdf
      - name: Make a PDF from the command line (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & release\win-unpacked\mysteditor.exe --export-pdf e2e\fixture-showcase\docs --output smoke.pdf | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path smoke.pdf)) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * | tee SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MyST Editor ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/*
