# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to test, build the
# AppImage, RPM and .deb, and publish them as a GitHub release. The tag must match the
# version in package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: Install rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
      - run: npm ci
      - name: Build the AppImage, RPM and .deb
        run: npm run dist
      - name: Checksums
        working-directory: release
        run: sha256sum *.AppImage *.rpm *.deb | tee SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MyST Editor ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/*.AppImage release/*.rpm release/*.deb release/SHA256SUMS
