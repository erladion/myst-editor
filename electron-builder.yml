appId: io.github.erladion.mysteditor
productName: MyST Editor
executableName: mysteditor
artifactName: MyST-Editor-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# uv sets up each project's Python environment; the driver runs Sphinx builds.
extraResources:
  - from: resources/uv
    to: uv
    filter: [uv]
  - from: resources/sphinx
    to: sphinx
    filter: ['*.py']
linux:
  target: [AppImage, rpm, deb]
  maintainer: erladion
  vendor: erladion
  category: Office
  syncDesktopName: true
  icon: build/icon.png
  synopsis: WYSIWYG editor for Sphinx + MyST Markdown
  description: Edit Sphinx documentation written in MyST Markdown as formatted pages, saving only what you change.
deb:
  # The libraries Electron links against, by Debian/Ubuntu package name. Since
  # Debian 13 and Ubuntu 24.04 some are named …t64; either name will do.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnss3
    - libnspr4
    - libatk1.0-0t64 | libatk1.0-0
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libatspi2.0-0t64 | libatspi2.0-0
    - libcups2t64 | libcups2
    - libdbus-1-3
    - libglib2.0-0t64 | libglib2.0-0
    - libcairo2
    - libpango-1.0-0
    - libx11-6
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxrandr2
    - libgbm1
    - libexpat1
    - libxcb1
    - libxkbcommon0
    - libudev1
    - libasound2t64 | libasound2
    - xdg-utils
  # Version control in the app uses the system's git.
  recommends:
    - git
rpm:
  # Libraries the Electron binary links against (readelf -d), as RPM sonames so any
  # distribution's packages can satisfy them (RHEL 9, Rocky/Alma, Fedora, openSUSE).
  # xdg-utils opens links in the browser.
  depends:
    - 'libglib-2.0.so.0()(64bit)'
    - 'libgobject-2.0.so.0()(64bit)'
    - 'libgio-2.0.so.0()(64bit)'
    - 'libnspr4.so()(64bit)'
    - 'libnss3.so()(64bit)'
    - 'libnssutil3.so()(64bit)'
    - 'libsmime3.so()(64bit)'
    - 'libatk-1.0.so.0()(64bit)'
    - 'libatk-bridge-2.0.so.0()(64bit)'
    - 'libcups.so.2()(64bit)'
    - 'libdbus-1.so.3()(64bit)'
    - 'libcairo.so.2()(64bit)'
    - 'libgtk-3.so.0()(64bit)'
    - 'libpango-1.0.so.0()(64bit)'
    - 'libX11.so.6()(64bit)'
    - 'libXcomposite.so.1()(64bit)'
    - 'libXdamage.so.1()(64bit)'
    - 'libXext.so.6()(64bit)'
    - 'libXfixes.so.3()(64bit)'
    - 'libXrandr.so.2()(64bit)'
    - 'libgbm.so.1()(64bit)'
    - 'libexpat.so.1()(64bit)'
    - 'libxcb.so.1()(64bit)'
    - 'libxkbcommon.so.0()(64bit)'
    - 'libudev.so.1()(64bit)'
    - 'libasound.so.2()(64bit)'
    - 'libatspi.so.0()(64bit)'
    - xdg-utils
  fpm:
    # Don't claim /usr/lib/.build-id entries other Electron apps also ship.
    - --rpm-rpmbuild-define=_build_id_links none
