appId: io.github.erladion.mysteditor
productName: MyST Editor
executableName: mysteditor
artifactName: MyST-Editor-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
linux:
  target: AppImage
  category: Office
  syncDesktopName: true
  icon: build/icon.png
  synopsis: WYSIWYG editor for Sphinx + MyST Markdown
  description: Edit Sphinx documentation written in MyST Markdown as formatted pages, saving only what you change.
